services:
  postgres:
    image: postgres:17-alpine
    container_name: motor-postgres
    environment:
      POSTGRES_USER: motor
      POSTGRES_PASSWORD: motor_dev
      POSTGRES_DB: motor_financeiro
    ports:
      - "5432:5432"
    volumes:
      - motor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d motor_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: motor-mongo
    ports:
      - "27017:27017"
    volumes:
      - motor_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: motor-redis
    ports:
      - "6379:6379"
    volumes:
      - motor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  motor_pg_data:
  motor_mongo_data:
  motor_redis_data:
